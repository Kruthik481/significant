services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ab
      POSTGRES_PASSWORD: ab
      POSTGRES_DB: ab
    ports: ["5436:5432"]
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ab"]
      interval: 2s
      retries: 20
